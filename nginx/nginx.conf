worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  keepalive_timeout 65;

  # ── Upstreams ──────────────────────────────────────────────────────────────
  upstream api       { server api:3001; }
  upstream web       { server web:3000; }
  upstream collab_ws { server api:1234; }

  # ── Internal HTTP server ───────────────────────────────────────────────────
  # SSL is terminated by https-portal; this server receives decrypted traffic
  # from https-portal on port 80 only.
  server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # ── Hocuspocus WebSocket (declare before catch-all /) ────────────────────
    location /collab {
      proxy_pass         http://collab_ws;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ── NestJS REST API ───────────────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      # https-portal sets X-Forwarded-Proto: https — pass it through
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Next.js web app (catch-all) ───────────────────────────────────────────
    location / {
      proxy_pass         http://web;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }
  }
}
