worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;

  # ── Upstreams ──────────────────────────────────────────────────────────────
  upstream api       { server api:3001; }
  upstream web       { server web:3000; }
  upstream collab_ws { server api:1234; }

  # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS ──────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Allow large attachments (email bodies, inline images)
    client_max_body_size 100M;

    # ── Hocuspocus WebSocket (Docs / Tasks real-time collab) ─────────────────
    # Must be declared before the catch-all / location.
    location /collab {
      proxy_pass         http://collab_ws;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      # Keep WS connections alive (collaborative sessions can be long)
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ── NestJS REST API ───────────────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Next.js web app (catch-all) ───────────────────────────────────────────
    location / {
      proxy_pass         http://web;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      # Required for Next.js HMR in development; harmless in production
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }
  }
}
