# electron-builder configuration
# Docs: https://www.electron.build/configuration/configuration

appId: com.risa.1govmail
productName: 1Gov Mail
copyright: Copyright © 2024 RISA

directories:
  # Source for build resources (icons, entitlements, etc.)
  buildResources: resources
  # Packaged installers are written here
  output: release

# The API's better-sqlite3 is already rebuilt for Electron by prepare-api.mjs
# (run via the prebuild npm hook before electron-builder).  Disabling electron-
# builder's own rebuild avoids a spurious `git fetch` for @electron/node-gyp.
npmRebuild: false

# ─── Files included in the packaged app ───────────────────────────────────────
# electron-builder v25 glob change: patterns like dist/** and dist/**/* fail
# the partial-directory filter check (dist dir gets EXCLUDED → walk never
# recurses into it).  Bare directory names (no glob wildcards) are the safe
# form: electron-builder auto-appends /**/* internally AND correctly passes
# the partial match that allows walk() to recurse into the directory.
# node_modules is intentionally omitted: main.ts only uses Electron framework
# APIs and Node.js built-ins — no external npm packages need to be bundled.
files:
  - dist             # Compiled TypeScript (main.js, preload.js, …)
  - package.json

# ─── Extra resources bundled alongside the app ────────────────────────────────
# These land in process.resourcesPath at runtime.
extraResources:
  # The Next.js standalone server (produced by `next build` with output:'standalone')
  - from: ../web/.next/standalone
    to: app
    filter:
      - "**/*"
  # Client-side JS bundles (NOT included in standalone automatically).
  # server.js resolves .next/static relative to its __dirname, which is
  # Resources/app/apps/web/ — so static files must live there too.
  - from: ../web/.next/static
    to: app/apps/web/.next/static
    filter:
      - "**/*"
  # Public assets (fonts, images, etc.) — same __dirname-relative rule.
  - from: ../web/public
    to: app/apps/web/public
    filter:
      - "**/*"
  # Bundled NestJS API + SQLite + production deps.
  # Produced by `pnpm --filter desktop prepare:api` before electron-builder.
  # At runtime the API is found at process.resourcesPath/api/.
  - from: api-bundle
    to: api
    filter:
      - "**/*"

# ─── macOS ────────────────────────────────────────────────────────────────────
# Icons are auto-generated by `pnpm generate-icons` (or the prebuild hook).
#
# CODE SIGNING & NOTARIZATION
# Without a valid Apple Developer ID certificate the app will show
# "damaged and can't be opened" on other Macs (macOS Gatekeeper).
#
# To enable signing:
#   export CSC_LINK=/path/to/certificate.p12   (or base64 of the .p12)
#   export CSC_KEY_PASSWORD=yourpassword
#
# To also notarize (required for clean distribution without Gatekeeper prompts):
#   export APPLE_ID=you@example.com
#   export APPLE_APP_PASSWORD=xxxx-xxxx-xxxx-xxxx   (app-specific password)
#   export APPLE_TEAM_ID=XXXXXXXXXX                 (10-char Team ID)
#
# Without those env vars electron-builder skips signing (CSC_IDENTITY_AUTO_DISCOVERY=false
# is set in the build:mac script to prevent partial/broken signatures).
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  # Hardened runtime is required for notarization.
  # Safe to enable even without a certificate — just has no effect when unsigned.
  hardenedRuntime: true
  # Skip Gatekeeper assessment at build time (notarization handles this at runtime).
  gatekeeperAssess: false
  # Entitlements required for Electron + hardened runtime.
  entitlementsFile: resources/entitlements.mac.plist
  entitlementsInheritFile: resources/entitlements.mac.plist
  # Notarization hook — only runs when APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID are set.
  afterSign: scripts/notarize.mjs
  target:
    - target: dmg
      arch:
        - x64    # Intel
        - arm64  # Apple Silicon

dmg:
  title: 1Gov Mail

# ─── Windows ──────────────────────────────────────────────────────────────────
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true      # silent install
  perMachine: false   # install per-user (no admin rights required)

# ─── Linux ────────────────────────────────────────────────────────────────────
linux:
  icon: resources/icon.png
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
